server.port=8083
# ===== 编码配置（Spring Boot 4.1 标准方式）=====
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
# 数据库连接（指向奥克兰 PostgreSQL）
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=payment_user
spring.datasource.password=payment_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# IBM MQ 连接配置（指向奥克兰 MQ 网关）
ibm.mq.queue-manager=QM_AKL_FR
ibm.mq.conn-name=localhost(1414)
ibm.mq.channel=DEV.ADMIN.SVRCONN
ibm.mq.user=app
ibm.mq.password=Password99

# 目标队列（发送至网关路由别名）
app.mq.outbound-queue=PAYMENT.TRANSFER.DEBIT.Q

# 依赖微服务接口调用配置
app.services.account-url=http://localhost:8082

